# MedLens — Nginx reverse proxy config
# Place this file at: /etc/nginx/sites-available/medlens
# Then: sudo ln -s /etc/nginx/sites-available/medlens /etc/nginx/sites-enabled/medlens

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Match multer's 10MB upload limit with a small buffer
    client_max_body_size 12M;

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Important for file uploads and AI calls (can take up to 30s)
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
    }
}

# After running: sudo certbot --nginx -d yourdomain.com
# Certbot will automatically add the HTTPS block below this one.
